# Wan 2.2 14B I2V LoRA Training with Rank Gate Annealing (SparseForge-inspired)
# 
# Rank gates are ENABLED BY DEFAULT for better training quality.
# This config shows explicit rank_gates settings for fine-tuning.
#
# How it works:
# - Each LoRA rank gets a soft gate m_r ∈ [0,1], starting at 1 (all active)
# - Gates anneal gradually based on curvature-aware importance scores
# - At end of training, gates harden to {0,1}, selecting surviving ranks
# - Prevents rank collapse by making decisions softly, not via hard truncation

processes:
  - model:
      arch: wan22_14b_i2v
      name_or_path: Wan-AI/Wan2.2-I2V-14B-Diffusers
      low_vram: true
      quantize: true
      quantize_te: true

    train:
      batch_size: 1
      steps: 20000
      gradient_accumulation: 1
      lr: 1e-5              # Note: use 'lr', not 'learning_rate'
      noise_scheduler: flowmatch
      timestep_type: weighted

    save:
      save_every: 1000

    sample:
      sample_every: 500
      prompts:
        - "A person walking down the street"
      num_frames: 81
      fps: 16
      width: 832
      height: 480
      guidance_scale: 5.0

    network:
      type: lora
      linear: 256        # Start with generous rank; gates will prune to ~30%
      alpha: 256
      
      # =================================================================
      # Rank Gate Annealing Configuration (ENABLED BY DEFAULT)
      # =================================================================
      # To DISABLE: set rank_gates.enabled: false
      #
      # RECOMMENDED: auto_timing (default). Annealing start/end and the final
      # hardening are all detected automatically from the ACTUAL training
      # dynamics — per expert, on each expert's own clock:
      #   - Annealing STARTS when that expert's loss plateaus (fast EMA ≈ slow
      #     EMA for plateau_confirm_steps, after warmup + min_anneal_steps).
      #   - Annealing ENDS when the LR has decayed below end_lr_fraction*peak.
      #   - Hardening STARTS when the LR decays below hardening_lr_fraction*peak.
      # Experts (transformer_1 / transformer_2) anneal completely independently
      # (separate step counters, Fisher/grad EMAs and phase timelines).
      # =================================================================
      rank_gates:
        enabled: true
        auto_timing: true          # AUTO: detect start/end/hardening from loss + LR
        target_rank_ratio: 0.3     # Fallback ratio if a per-tensor budget fails
        # --- plateau / LR triggers (learning-aware) ---
        plateau_relative_threshold: 5.0e-3  # loss "flat" if <0.5% change over EMA window
        plateau_confirm_steps: 50          # consecutive flat steps to start annealing
        min_anneal_steps: 200              # per-expert floor before annealing may start
        end_lr_fraction: 0.2               # anneal completes when LR < 20% of peak
        anneal_max_duration: 1500          # per-expert step clock if LR is constant
        hardening_lr_fraction: 0.05        # harden when LR < 5% of peak
        hardening_min_steps: 150           # per-expert min hardening window
        # --- gate dynamics ---
        temperature: 1.0           # Initial sigmoid temperature
        gamma: 0.95                # Temperature decay per update (faster sharpening)
        alpha: 0.1                 # Gate EMA rate (faster updates)
        lambda_mid_max: 0.01       # Binary preference penalty max (stronger)
        update_every: 15           # Update gates every N per-expert steps
        fisher_decay: 0.999        # Fisher EMA decay (keep long memory)
        use_first_order: true      # Include |g·w| term (recommended for diffusion)
        eta_pen: 0.01              # Mid-preference nudge strength
        final_hardening: true      # Binarize gates at end
        # --- "button": also emit a rank-REDUCED checkpoint on every save ---
        save_truncated: false      # true -> writes <name>_truncated.safetensors
        truncation_threshold: 0.5  # gate value above which a rank is kept
        # --- MANUAL override (legacy): set auto_timing: false to use these ---
        # auto_timing: false
        # start_step: 1000
        # end_step: 14000
        # hardening_window: 500

    datasets:
      - folder_path: /path/to/dataset
        resolution: 480
        num_frames: 81
        fps: 16
        buckets: true
        cache_latents_to_disk: true
        do_i2v: true
        do_t2v: true
        num_workers: 4
